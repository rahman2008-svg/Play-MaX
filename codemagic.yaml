workflows:
  android-playmax:
    name: PlayMax Android CI Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Setup project
        script: |
          echo "Setting up PlayMax build environment..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant Gradle permission
        script: |
          chmod +x ./gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - princearabdurrahman57@gmail.com
        notify:
          success: true
          failure: true
