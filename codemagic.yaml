workflows:
  android-playmax:
    name: PlayMax Android Player CI
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Setup project
        script: |
          echo "Setting up Android build..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew

      - name: Clean build
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
