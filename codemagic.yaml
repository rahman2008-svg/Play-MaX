# Codemagic CI/CD Build Configuration for PlayMax Android
workflows:
  android-playmax:
    name: PlayMax Android Player CI
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      android_target_sdk: 36
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Set up project files
        script: |
          echo "Preparing properties and local files"
          touch local.properties
      - name: Build Android Debug APK
        script: |
          chmod +x gradlew || true
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
